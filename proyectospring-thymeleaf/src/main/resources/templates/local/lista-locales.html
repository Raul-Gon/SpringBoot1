<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>
    
    <!-- Estilos CSS modernos para la tabla, mensajes y botones -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center; /* Centra todo el contenido horizontalmente */
        }

        h2 {
            color: #007bff;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            text-align: center;
            width: 80%;
        }
        
        /* Estilo para los mensajes de Thymeleaf (warning/success/info) */
        p {
        	padding: 10px 15px;
        	border-radius: 5px;
        	margin-bottom: 15px;
        	width: 80%;
        	box-sizing: border-box;
        }

		.warni {
		    background-color: #fff3cd;
		    color: #856404;
		    border: 1px solid #ffeeba;
		}

		.succe {
		    background-color: #d4edda;
		    color: #155724;
		    border: 1px solid #c3e6cb;
		}
		
		.localesNull {
			background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
		}


        /* Estilo para la tabla */
        table {
            width: 80%;
            margin: 20px 0;
            border-collapse: collapse;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
        }

        thead th {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        tbody td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            color: #555;
        }

        tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tbody tr:hover {
            background-color: #f1f1f1;
        }

        /* Estilo general para los botones (usamos las etiquetas button directamente aquí) */
        button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 5px;
            transition: background-color 0.3s ease;
        }

        button:hover {
        	opacity: 0.8;
        }
        
        td button:nth-child(1) { background-color: #17a2b8; color: white; }
        td button:nth-child(2) { background-color: #ffc107; color: black; }
        td button:nth-child(3) { background-color: #dc3545; color: white; }

        /* Contenedor para los botones inferiores (INICIO y NUEVO LOCAL) */
        .footer-buttons-container {
            display: flex;
            gap: 15px; /* Espacio entre los botones inferiores */
            margin-top: 30px; /* Más espacio respecto a la tabla */
            justify-content: center;
            width: 80%;
        }
        
        /* Estilos específicos para los botones del footer */
        .footer-buttons-container button {
            padding: 12px 20px;
            font-size: 16px;
            margin-right: 0; /* Eliminamos el margen derecho que tenían los otros botones */
        }
        
        /* Botón INICIO (color azul para diferenciarlo del botón verde que ya existía arriba) */
        .btn-home {
             background-color: #007bff;
             color: white;
        }
        
        .btn-home:hover {
        	opacity: 0.9;
        }
        
        /* Color específico para el botón "Nuevo local" */
        .btn-new {
            background-color: #28a745; /* Verde */
            color: white;
        }
        .btn-new:hover {
        	opacity: 0.9;
        }
        
        /* El botón "Nuevo local" ya existente en la parte superior */
        body > a > button {
            background-color: #28a745;
            color: white;
            padding: 12px 20px;
            margin-top: 20px;
            display: inline-block;
        }
        
        body > a > button:hover {
        	background-color: #218838;
        }
        
        /* Estilo para los enlaces dentro de la tabla */
        td a {
        	text-decoration: none;
        	color: #007bff;
        }
        
        td a:hover {
        	text-decoration: underline;
        }
        
    </style>
</head>
<body>
			
    <h2 th:text="${h2}"></h2>
    
    <!-- Mensajes de estado -->
    <p th:if="${locales == null || locales.size() == 0}" class="localesNull">No hay locales comerciales que mostrar</p>
    <p th:if="${warning != null}" th:text="${warning}" class="warni"></p>
    <p th:if="${success != null}" th:text="${success}" class="succe"></p>
        
    <table>
    <thead>
    
      <tr>
        <th>Id</th>
        <th>Nombre Local</th>
        <th>Dirección Completa</th>
        <th>Metros Cuadrados</th>
        <th>Precio de Alquiler</th>
        <th>Acciones</th>
        
      </tr>
    </thead>
    <tbody>
      <tr th:each="local: ${locales}">
        <td th:text="${local.id}"></td>
        <td>
        	<!-- Enlace en el nombre -->
        	<a th:href="@{'/local/nombre/' + ${local.nombreCompleto}}" th:text="${local.nombreCompleto}"></a>
        </td>
        <td>
        	<span th:text="${local.direccionCompleta}"></span>
        </td>
        
        <td th:text="${local.metrosCuadrados}"></td>
        <td th:text="${local.precioAlquiler}"></td>
		<td>
			<!-- Botones de acción en la tabla -->
			<a th:href="@{'/local/id/' + ${local.id}}"><button>Ver</button></a>
			<a th:href="@{'/local/form/id/' + ${local.id}}"><button>Editar</button></a>
			<a th:href="@{'/local/borra/id/' + ${local.id}}"><button>Borrar</button></a>
		</td>
      </tr>
    </tbody>
    </table>
    
    <!-- Contenedor para los botones del final -->
    <div class="footer-buttons-container">
	    <!-- Botón de inicio -->
	    <a th:href="@{/local/home}"><button class="btn-home">Inicio</button></a>
	    
	    <!-- Botón para crear nuevo local -->
        <a th:href="@{/local/form/id/-1}">
            <button class="btn-new">Nuevo local</button>
        </a>
    </div>	

</body>
</html>
