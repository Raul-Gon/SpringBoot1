<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title th:text="${titulo}"></title>
	</head>
	<body>
		<h1 th:text="${cabecera}"></h1>
		<br/>
		<br/>
		
		<form th:action="@{/articulo/form}" th:object="${articulo}" method="post"> 
			<label th:if="${articulo.id != null}">ID: <span th:text="${articulo.id}"></span></label>
			<input type="hidden" th:field="*{id}" /> <br/>
			<label>Nombre:</label>
			<input type="text" th:field="*{nombre}" placeholder="introduce nombre" /> <br/>
			<label>Precio:</label>
			<input type="number" step="0.01" th:field="*{precio}" placeholder="introduce precio" /> <br/>
			<label>Descuento:</label>
			<input type="number" th:field="*{descuento}" placeholder="introduce descuento" /> <br/>
			<label>Stock:</label>
			<input type="number" th:field="*{stock}" placeholder="introduce stock" /> <br/>
			<label>Tipo:</label>
			<input type="text" th:field="*{tipo}" placeholder="introduce tipo" /> <br/>
			<button>Enviar</button>
		</form>
		
	</body>
</html>
