<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title th:text="${titulo}"></title>
	</head>
	<body>
		<h1 th:text="${cabecera}"></h1>
		
		<form th:action="@{/cliente/form}" th:object="${cliente}" method="post"> <br/>
			<label th:if="${cliente.id != null}">ID: <span th:text="${cliente.id}"></span></label>
			<input type="hidden" th:field="*{id}" /> <br/>
			<label>Nombre:</label>
			<input type="text" th:field="*{nombre}" placeholder="introduce nombre" /> <br/>
			<label>Apellido:</label>
			<input type="text" th:field="*{apellido}" placeholder="introduce apellido" /> <br/>
			<label>Email:</label>
			<input type="text" th:field="*{email}" placeholder="introduce email" /> <br/>
			<button>Enviar</button>
		</form>
		
	</body>
</html>
