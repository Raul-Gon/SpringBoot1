<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title th:text="${titulo}"></title>
		
		<style>
			.succes {
				background: Yellow;
				border-radius: 5px;
				width: 80%;
				padding: 3px 20px;
			}
		.warning{
			background: red;
				border-radius: 5px;
				width: 80%;
				padding: 3px 20px;
		}	
			
		</style>
		
	</head>
	<body>
	<div class="warning" th:if="${warning != null}" th:text="${warning}"></div>
	<div class="succes" th:if="${succes != null}" th:text="${succes}"></div>
		<header th:replace="~{layout/base :: header-comun}"></header>
		<h1 th:text="${cabecera}"></h1>
		
		<a th:href="@{/cliente/form/-1}">AÑADIR UN CLIENTE</a>
		
		<p th:if="${clientes == null || clientes.size() == 0}">No hay clientes que mostrar.</p>		
		<table border="1" th:if="${!(clientes == null || clientes.size() == 0)}">
			<thead>
				<tr>
					<th>ID</th>
					<th>NOMBRE</th>
					<th>APELLIDO</th>
					<th>EMAIL</th>
					<th>ACCIONES</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="cliente : ${clientes}")>
					<td th:text="${cliente.id}"></td>
					<td th:text="${cliente.nombre}"></td>
					<td th:text="${cliente.apellido}"></td>
					<td th:text="${cliente.email}"></td>
					<td>
						<a th:href="@{'/cliente/id/' + ${cliente.id}}">Ver</a>
						<a th:href="@{'/cliente/borrar/' + ${cliente.id}}">Borrar</a>
						<a th:href="@{'/cliente/form/' + ${cliente.id}}">Editar</a>
					</td>
				</tr>
			</tbody>
		</table>
		
		<footer th:replace="~{layout/base :: footer-comun}"></footer>
		
	</body>
</html>
