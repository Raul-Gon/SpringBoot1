<!DOCTYPE html>
<html th:replace="~{fragments/layout :: html(pageTitle='Administrar Preguntas', content = ~{::content})}">
<head>
    <!-- El head se ignora, se usa el del layout -->
</head>
<body>

<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Lista de Preguntas</h1>
        <a href="/view/preguntas/new" class="btn btn-primary">Crear Nueva Pregunta</a>
    </div>

    <!-- Bloque para mostrar el mensaje de feedback -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>
                    <a class="text-white text-decoration-none" th:href="@{/view/preguntas(sort='id,' + ${paginaPreguntas.sort.getOrderFor('id') != null && paginaPreguntas.sort.getOrderFor('id').isAscending() ? 'desc' : 'asc'})}">ID</a>
                </th>
                <th>
                    <a class="text-white text-decoration-none" th:href="@{/view/preguntas(sort='enunciado,' + ${paginaPreguntas.sort.getOrderFor('enunciado') != null && paginaPreguntas.sort.getOrderFor('enunciado').isAscending() ? 'desc' : 'asc'})}">Enunciado</a>
                </th>
                <th>
                    <a class="text-white text-decoration-none" th:href="@{/view/preguntas(sort='respuesta,' + ${paginaPreguntas.sort.getOrderFor('respuesta') != null && paginaPreguntas.sort.getOrderFor('respuesta').isAscending() ? 'desc' : 'asc'})}">Respuesta</a>
                </th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pregunta : ${paginaPreguntas.content}">
                <td th:text="${pregunta.id}"></td>
                <td th:text="${pregunta.enunciado}"></td>
                <td th:text="${pregunta.respuesta} ? 'Verdadero' : 'Falso'"></td>
                <td>
                    <a th:href="@{/view/jugar/{id}(id=${pregunta.id})}" class="btn btn-sm btn-success">Simular</a>
                    <a th:href="@{/view/preguntas/view/{id}(id=${pregunta.id})}" class="btn btn-sm btn-info">Ver</a>
                    <a th:href="@{/view/preguntas/edit/{id}(id=${pregunta.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/view/preguntas/delete/{id}(id=${pregunta.id})}" class="btn btn-sm btn-danger">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${paginaPreguntas.totalPages > 1}" aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!paginaPreguntas.hasPrevious()} ? 'disabled' : ''">
                <a class="page-link" th:href="@{/view/preguntas(page=${paginaPreguntas.number - 1}, size=${paginaPreguntas.size}, sort=${paginaPreguntas.sort.toString().replace(': ', ',')})}">Anterior</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, paginaPreguntas.totalPages - 1)}" th:classappend="${i == paginaPreguntas.number} ? 'active' : ''">
                <a class="page-link" th:href="@{/view/preguntas(page=${i}, size=${paginaPreguntas.size}, sort=${paginaPreguntas.sort.toString().replace(': ', ',')})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${!paginaPreguntas.hasNext()} ? 'disabled' : ''">
                <a class="page-link" th:href="@{/view/preguntas(page=${paginaPreguntas.number + 1}, size=${paginaPreguntas.size}, sort=${paginaPreguntas.sort.toString().replace(': ', ',')})}">Siguiente</a>
            </li>
        </ul>
    </nav>
</div>

</body>
</html>
